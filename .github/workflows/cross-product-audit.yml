name: Cross-product regression audit

on:
  push:
    branches: [main, work/company-admin-controls]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: irlam/site-deliveries
          path: delivery-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/cleanup-notices
          path: notices-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/safety-tracker
          path: safety-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/defect-tracker
          path: defects-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/permits
          path: permits-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/programme
          ref: 4e9d7d6c41d03773c7958dfd6141a5d3fcd7204d
          path: programme-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/handover
          path: handover-source
      - uses: actions/checkout@v4
        with:
          repository: irlam/status
          path: status-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, curl, ctype
      - name: Suite syntax and permissions
        run: |
          php tests/bootstrap-smoke.php
          php tests/project-scope.php
          php tests/notifications.php
          php tests/company-tenancy.php
          php tests/company-settings.php
          php tests/module-handoff.php
          python3 tests/company-http.py
      - name: Delivery booking API contracts
        run: |
          php -l delivery-source/api/suite-summary.php
          php delivery-source/tests/suite-integration.php
      - name: Safety Tours recovery and source contracts
        run: |
          php -l safety-source/actions.php
          php -l safety-source/api/suite-summary.php
          php safety-source/tests/suite-integration.php
      - name: Permit approval entry point syntax
        run: |
          php -l permits-source/manager-approvals.php
          php -l permits-source/api/suite-summary.php
      - name: Defect field and training regressions
        run: |
          php -l defects-source/defects.php
          php defects-source/tests/offline-field-regression.php
          php defects-source/tests/training-regression.php
          php defects-source/tests/branding-regression.php
      - name: Notices secure API checks
        run: |
          php -l notices-source/forms/clean-up/list.php
          php notices-source/tests/suite-integration.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notices-source/package-lock.json
      - name: Notices durable offline sync regression
        working-directory: notices-source
        run: |
          npm ci
          npm test
      - name: Programme isolated adapter and Excel scheduling regressions
        working-directory: programme-source
        run: |
          php tests/private-config.php
          php tests/suite-gateway.php
          php tests/suite-user-map.php
          php tests/suite-session.php
          python3 tests/schedule_regression.py
          python3 tests/maintenance-web-guards.py
          python3 tests/suite-http.py
          python3 tests/suite-package.py
      - name: Handover entry points and application syntax
        run: find handover-source/src handover-source/config handover-source/public handover-source/templates handover-source/scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Status endpoint syntax
        run: |
          php -l status-source/api.php
          php -l status-source/config.php
