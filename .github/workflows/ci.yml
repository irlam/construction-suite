name: Construction Suite checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite
      - name: PHP syntax
        run: find app config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bootstrap smoke test
        run: php tests/bootstrap-smoke.php
