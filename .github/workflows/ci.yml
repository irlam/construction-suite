name: Construction Suite checks

on:
  push:
    branches: [main, work/tenant-handoff-foundation, work/company-admin-controls]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite
      - name: PHP syntax
        run: find app bin config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bootstrap smoke test
        run: php tests/bootstrap-smoke.php
      - name: Project scoping regression
        run: php tests/project-scope.php
      - name: Notifications permissions regression
        run: php tests/notifications.php

      - name: Company tenancy regression
        run: php tests/company-tenancy.php

      - name: Company settings and tool preferences regression
        run: php tests/company-settings.php

      - name: Company administration HTTP workflow
        run: python3 tests/company-http.py

      - name: Module handoff security regression
        run: php tests/module-handoff.php

  mysql-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: suite_test_company_controls
            script: tests/company-settings.php
          - database: suite_test_module_gateway
            script: tests/module-mysql.php
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: ${{ matrix.database }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
      - name: Company and gateway controls on MySQL 8.4
        env:
          SUITE_TEST_MYSQL: '1'
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: ${{ matrix.database }}
          DB_USERNAME: root
          DB_PASSWORD: fixture-only-password
        run: php ${{ matrix.script }}
