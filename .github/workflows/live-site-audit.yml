name: Public live-site integration audit

on:
  push:
    branches: [main, work/company-admin-controls]
  workflow_dispatch:

jobs:
  endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Check live HTTPS entry points and fail-closed APIs
        shell: bash
        run: |
          set -u
          failures=0
          printf '%-60s %s\n' "URL" "HTTP"
          for url in \
            https://suite.defecttracker.uk/ \
            https://defectnotice.site/ \
            https://sitepermits.site/ \
            https://sitesafety.site/ \
            https://sitedeliveries.site/ \
            https://sitenotices.site/ \
            https://handover.defecttracker.uk/ \
            https://programme.defecttracker.uk/ \
            https://status.defecttracker.uk/ \
            https://suite.defecttracker.uk/manifest.webmanifest \
            https://suite.defecttracker.uk/service-worker.js; do
            code=$(curl -sS -L --retry 1 --connect-timeout 8 --max-time 25 \
              --output /dev/null --write-out '%{http_code}' "$url") || code="000"
            printf '%-60s %s\n' "$url" "$code"
            if [[ ! "$code" =~ ^(200|301|302|303|307|308|401|403)$ ]]; then failures=$((failures + 1)); fi
          done

          # Unauthenticated calls must not expose data. A 503 means the
          # integration is not configured and requires manual private settings.
          for url in \
            https://defectnotice.site/api/suite-summary.php \
            https://sitepermits.site/api/suite-summary.php \
            https://sitesafety.site/api/suite-summary.php \
            https://sitedeliveries.site/api/suite-summary.php \
            https://sitenotices.site/api/suite-summary.php; do
            code=$(curl -sS --retry 1 --connect-timeout 8 --max-time 25 \
              --output /dev/null --write-out '%{http_code}' "$url") || code="000"
            printf '%-60s %s\n' "$url" "$code"
            if [[ "$code" != "401" ]]; then
              echo "::warning::Expected HTTP 401 without a private Suite key on $url; got $code"
              failures=$((failures + 1))
            fi
          done

          # Read-only probes of existing Deliveries pages help distinguish
          # a broken database bootstrap from a broken Suite-only endpoint.
          for url in \
            https://sitedeliveries.site/gateboard_data.php \
            https://sitedeliveries.site/gateboard.php \
            https://sitedeliveries.site/api/suite-references.php; do
            code=$(curl -sS --retry 1 --connect-timeout 8 --max-time 25 \
              --output /dev/null --write-out '%{http_code}' "$url") || code="000"
            printf '%-60s %s\n' "$url" "$code"
          done

          # Staging UI availability and anonymous denial only. These checks do
          # not establish authenticated access, tenant isolation or readiness.
          for host in alpha.programme.defecttracker.uk beta.programme.defecttracker.uk; do
            for path in / /api/workspace.php /app/suite-prepend.php /deployment/manifest.json; do
              url="https://$host$path"
              code=$(curl -sS --connect-timeout 8 --max-time 25 --output /dev/null --write-out '%{http_code}' "$url") || code="000"
              printf '%-60s %s\n' "$url" "$code"
              case "$path" in
                /) [[ "$code" == "200" ]] || failures=$((failures + 1));;
                /api/workspace.php) [[ "$code" =~ ^(401|403|503)$ ]] || failures=$((failures + 1));;
                *) [[ "$code" =~ ^(403|404)$ ]] || failures=$((failures + 1));;
              esac
            done
          done

          if [ "$failures" -gt 0 ]; then
            echo "::error::Public probe found $failures unverified endpoints."
            exit 1
          fi
          echo "PASS: public sites respond and protected endpoints reject anonymous requests."
